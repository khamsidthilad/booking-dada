<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dada Cafe Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Lao:wght@400;600&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="book" id="book" aria-live="polite"></div>
    <div class="mbook" id="mbook"></div>
  </main>

  <nav class="controls">
    <button id="prev" aria-label="หน้าก่อนหน้า">&#10094;</button>
    <span id="indicator">ปก</span>
    <button id="next" aria-label="หน้าถัดไป">&#10095;</button>
  </nav>
  <p class="hint">คลิกที่หน้าหนังสือ ปัดซ้าย-ขวา หรือใช้ปุ่มลูกศรบนคีย์บอร์ด</p>

  <script src="script.js"></script>
</body>
</html>
